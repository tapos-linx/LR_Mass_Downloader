name: Build, Test, Sign & Release LRgetBD APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test, Lint & Release Signed LRgetBD.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Dynamic App Version
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VER_NAME="${RAW_TAG#v}"
            VER_CODE="${RUN_NUM}"
            VER_TAG="${RAW_TAG}"
          else
            VER_NAME="1.1.${RUN_NUM}"
            VER_CODE="$((100 + RUN_NUM))"
            VER_TAG="v1.1.${RUN_NUM}"
          fi
          echo "VERSION_NAME=${VER_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VER_CODE}" >> $GITHUB_ENV
          echo "VERSION_TAG=${VER_TAG}" >> $GITHUB_ENV
          echo "Generated Version: ${VER_NAME} (Build ${VER_CODE}, Tag ${VER_TAG})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Prepare Release Signing Keystore (From GitHub Secrets or CI Fallback)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> $GITHUB_ENV
          else
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -storepass lrgetbd_release_store -keypass lrgetbd_release_key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LRgetBD Release,O=LRgetBD Open Source,C=BD"
            echo "STORE_PASSWORD=lrgetbd_release_store" >> $GITHUB_ENV
            echo "KEY_PASSWORD=lrgetbd_release_key" >> $GITHUB_ENV
          fi

      - name: Run Unit & Robolectric QA Tests
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace || gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint Checks
        run: |
          ./gradlew :app:lintDebug --stacktrace || gradle :app:lintDebug --stacktrace

      - name: Build Signed Production Release APK (LRgetBD.apk)
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace || gradle :app:assembleRelease --stacktrace

      - name: Verify Signed Release APK Output & Generate SHA-256 Checksum
        run: |
          mkdir -p release-output
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "ERROR: Signed release APK was not found or is empty!"
            exit 1
          fi
          cp "$RELEASE_APK" release-output/LRgetBD.apk
          cp "$RELEASE_APK" release-output/LRMassDownloader.apk
          cd release-output
          sha256sum LRgetBD.apk > LRgetBD.apk.sha256
          cat LRgetBD.apk.sha256
          ls -lh

      - name: Clean Ephemeral Signing Keystore
        if: always()
        run: rm -f my-upload-key.jks

      - name: Upload Signed LRgetBD.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LRgetBD-${{ env.VERSION_TAG }}-Release
          path: |
            release-output/LRgetBD.apk
            release-output/LRgetBD.apk.sha256
          retention-days: 90

      - name: Publish GitHub Release (LRgetBD.apk + SHA-256)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "LRgetBD ${{ env.VERSION_TAG }} (Build ${{ env.VERSION_CODE }})"
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📜 LRgetBD — Production Release ${{ env.VERSION_TAG }}
            **Complete Bangladesh Geographical Database, Automatic Mouza Selection & Intelligent Mass Land-Record Archive**

            #### 🚀 Direct Production APK Download (100% Free & Public):
            - 👉 [**Download LRgetBD.apk (Latest Signed Release)**](https://github.com/${{ github.repository }}/releases/latest/download/LRgetBD.apk)
            - 🔐 [**Download LRgetBD.apk.sha256 Checksum**](https://github.com/${{ github.repository }}/releases/latest/download/LRgetBD.apk.sha256)

            ---

            #### 📊 Build & Verification Metadata:
            - **Version Name:** `${{ env.VERSION_NAME }}`
            - **Version Code:** `${{ env.VERSION_CODE }}`
            - **Git Commit:** `${{ github.sha }}`
            - **Geographic Coverage:** All 8 Divisions, All 64 Districts, Verified Upazilas & Mouzas
            - **Batch Engine:** 7 Mouzas per Batch (`Room` + `WorkManager` persistent queue)
            - **Document Integrity:** ISO 32000-1 PDF structure validation & cryptographic `SHA-256` checksums
          files: |
            release-output/LRgetBD.apk
            release-output/LRgetBD.apk.sha256
            release-output/LRMassDownloader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
